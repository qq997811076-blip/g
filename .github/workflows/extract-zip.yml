
name: Extract ZIP to Main Directory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gxg-extract-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download source ZIP
        run: |
          curl -fL \
            https://github.com/qq997811076-blip/gxg/archive/84f2a2b133aa34fa5b7b60e6bb5419212f5b03df.zip \
            -o /tmp/gxg-source.zip

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/gxg-source
          unzip -oq /tmp/gxg-source.zip -d /tmp/gxg-source

          SOURCE_DIR="/tmp/gxg-source/gxg-84f2a2b133aa34fa5b7b60e6bb5419212f5b03df"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Extracted source directory not found"
            find /tmp/gxg-source -maxdepth 2 -type d
            exit 1
          fi

          cp -a "$SOURCE_DIR"/. .

      - name: Commit changes to main
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Extract gxg source into main directory"
          git push origin HEAD:main
