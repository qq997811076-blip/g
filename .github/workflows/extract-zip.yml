
name: Restore gxg source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gxg-source-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download baseline source
        run: |
          curl -fL \
            https://github.com/qq997811076-blip/gxg/archive/84f2a2b.zip \
            -o /tmp/gxg-source.zip

      - name: Replace repository files
        run: |
          git rm -r --ignore-unmatch .
          unzip -oq /tmp/gxg-source.zip -d /tmp/gxg-source
          cp -a /tmp/gxg-source/gxg-84f2a2b/. .
          git add -A
          git diff --cached --quiet && {
            echo "No changes to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore gxg source from baseline 84f2a2b"
          git push origin "HEAD:${GITHUB_REF_NAME}"
