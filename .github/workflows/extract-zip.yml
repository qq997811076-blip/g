name: Extract ZIP to Main Directory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gxg-extract-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source ZIP
        run: |
          ZIP="gxg-isp-auto-target-20261030.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP not found in repository root"; exit 1; }
          unzip -tq "$ZIP"
          mkdir -p "$RUNNER_TEMP/gxg-source"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/gxg-source"

      - name: Extract source into repository root
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gxg-source"
          ZIP="gxg-isp-auto-target-20261030.zip"

          # Detect whether the archive has one wrapper directory or files at its root.
          mapfile -t TOPS < <(find "$ROOT" -mindepth 1 -maxdepth 1 -print)
          if [ "${#TOPS[@]}" -eq 1 ] && [ -d "${TOPS[0]}" ]; then
            SRC="${TOPS[0]}"
          else
            SRC="$ROOT"
          fi

          # Copy the complete archive contents, including .github/workflows/.
          # Do not copy macOS metadata into the repository.
          rsync -a --exclude='__MACOSX/' "$SRC"/ ./

          # Remove the source archive only after extraction succeeds.
          rm -- "$ZIP"

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract gxg source ZIP into repository root"
          git push origin HEAD:main
