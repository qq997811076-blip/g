name: Extract ZIP to Main Directory

on:
  push:
    branches:
      - main
    paths:
      - "gxg-isp-auto-target-20261030.zip"
      - ".github/workflows/extract-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gxg-extract-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check source ZIP
        id: source
        shell: bash
        run: |
          ZIP="gxg-isp-auto-target-20261030.zip"
          if [ ! -f "$ZIP" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Source ZIP is not present; nothing to extract."
            exit 0
          fi
          unzip -tq "$ZIP"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Extract source into repository root
        if: steps.source.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="gxg-isp-auto-target-20261030.zip"
          ROOT="$RUNNER_TEMP/gxg-source"
          mkdir -p "$ROOT"
          unzip -oq "$ZIP" -d "$ROOT"

          # Strip a single wrapper directory when the archive contains one.
          mapfile -t TOPS < <(find "$ROOT" -mindepth 1 -maxdepth 1 -print)
          if [ "${#TOPS[@]}" -eq 1 ] && [ -d "${TOPS[0]}" ]; then
            SRC="${TOPS[0]}"
          else
            SRC="$ROOT"
          fi

          # Keep this automation workflow active even if the ZIP contains an older copy.
          mkdir -p "$RUNNER_TEMP/workflow-backup"
          cp .github/workflows/extract-zip.yml "$RUNNER_TEMP/workflow-backup/extract-zip.yml"

          # Extract all project files, including other files under .github/workflows/.
          rsync -a --exclude='__MACOSX/' --exclude='.github/workflows/build-apk.yml' "$SRC"/ ./

          # Restore the current automation workflow after extracting the archive.
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/workflow-backup/extract-zip.yml" .github/workflows/extract-zip.yml

          # Delete the ZIP only after extraction succeeds.
          rm -- "$ZIP"

      - name: Commit and push extracted files
        if: steps.source.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract source ZIP into repository root"
          git push origin HEAD:main
